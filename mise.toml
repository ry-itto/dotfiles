# mise bootstrap configuration for this dotfiles repository.
#
# Set up a new machine (mise itself must already be installed, e.g. `brew install mise`):
#
#   git clone <repo> && cd <repo>
#   MISE_EXPERIMENTAL=1 mise bootstrap --yes
#
# `mise bootstrap` is experimental and must be enabled. On an already
# bootstrapped machine `experimental = true` lives in ~/.config/mise/config.toml
# (symlinked from home/.config/mise/config.toml); on a fresh machine that file
# does not exist yet, so pass MISE_EXPERIMENTAL=1 the first time.
#
# Bootstrap step order (see `mise bootstrap --help`):
#   1. [bootstrap.packages] install  + post-packages hook  -> Homebrew via Brewfile
#   2. [dotfiles] apply                                     -> symlinks below
#   3. [bootstrap.macos.defaults]     + post-defaults hook  -> macOS settings
#   7. mise install ([tools])                               -> language runtimes
#   8. task `bootstrap`                                     -> vim/zsh plugin managers

[tools]
# Flutter development
flutter = "latest"
# Rust development
rust = "stable"
# Vim/Neovim
vim = "latest"

# ---------------------------------------------------------------------------
# Dotfiles — symlink sources under home/ to their $HOME targets.
# Applied by `mise bootstrap` (or `mise dotfiles apply`).
# Whole directories that are entirely ours are symlinked as a unit; files that
# share a parent with non-managed content are symlinked individually.
# ---------------------------------------------------------------------------
[dotfiles]
"~/.zshrc" = { mode = "symlink", source = "home/.zshrc" }
"~/.zsh" = { mode = "symlink", source = "home/.zsh" }
"~/.vim" = { mode = "symlink", source = "home/.vim" }
"~/.gitconfig" = { mode = "symlink", source = "home/.gitconfig" }
"~/.hammerspoon" = { mode = "symlink", source = "home/.hammerspoon" }
"~/.claude/settings.json" = { mode = "symlink", source = "home/.claude/settings.json" }
"~/.config/nvim" = { mode = "symlink", source = "home/.config/nvim" }
"~/.config/ghostty" = { mode = "symlink", source = "home/.config/ghostty" }
"~/.config/starship.toml" = { mode = "symlink", source = "home/.config/starship.toml" }
"~/.config/mise/config.toml" = { mode = "symlink", source = "home/.config/mise/config.toml" }
"~/Library/Application Support/Code/User/settings.json" = { mode = "symlink", source = "home/Library/Application Support/Code/User/settings.json" }

# ---------------------------------------------------------------------------
# macOS defaults (declarative). Replaces run_onchange_configure-macos-defaults.sh
# and the static defaults of run_onchange_configure-xcode.sh. Imperative bits
# (Caps Lock remap, dynamic core count, xcodes install) live in the
# post-defaults hook / macos-extra task below.
# ---------------------------------------------------------------------------
[bootstrap.macos.defaults]
"NSGlobalDomain" = { AppleShowAllExtensions = true, KeyRepeat = 2, InitialKeyRepeat = 25, ApplePressAndHoldEnabled = false }
"com.apple.finder" = { AppleShowAllFiles = true }
"com.apple.dt.Xcode" = { ShowBuildOperationDuration = true, DVTTextEditorTrimWhitespaceOnlyLines = true }

# ---------------------------------------------------------------------------
# Hooks — delegate to file tasks under mise-tasks/. (Hooks do not expand
# {{config_root}} and lack $MISE_PROJECT_ROOT, but their cwd is the repo root
# and `mise run` works, so the logic lives in the task scripts where
# $MISE_PROJECT_ROOT is available.)
# ---------------------------------------------------------------------------
[bootstrap.hooks]
post-packages = "mise run brew-bundle"
post-defaults = "mise run macos-extra"

# Tasks are defined as executable scripts under mise-tasks/ (auto-discovered):
#   mise-tasks/brew-bundle  — Homebrew formulae + casks from Brewfile
#   mise-tasks/macos-extra  — imperative macOS settings (Caps Lock, Xcode, xcodes)
#   mise-tasks/bootstrap    — vim/zsh plugin managers; runs at bootstrap step 8
